name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Smoke bench
        run: |
          phb run --backend mock --repetitions 1 --phases exit,washout_2 --output runs/smoke.jsonl
          phb analyze --input runs/smoke.jsonl --output-prefix runs/smoke-report
          phb plot --report runs/smoke-report.json --output runs/smoke.svg
          phb generate --variation seeded_v1 --repetitions 6 --seed 100 \
            --conditions ordered,tail_matched --phases exit \
            --probes flaky_ci,parser_validator --output runs/pilot.jsonl
          phb sweep-plan --input runs/pilot.jsonl --layers 0,last \
            --alphas 0,1 --sources ordered --heldout-probes parser_validator \
            --output runs/pilot-plan.json
  mechanistic:
    name: CPU forward-hook tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and local package
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2'
          python -m pip install -e '.[test]'
      - name: Verify actual forward-hook intervention paths
        run: |
          python -m pytest tests/test_interventions.py tests/test_sweep.py tests/test_freegen.py -q
