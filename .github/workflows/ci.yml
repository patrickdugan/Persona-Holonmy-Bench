name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Smoke bench
        run: |
          phb run --backend mock --repetitions 1 --phases exit,washout_2 --output runs/smoke.jsonl
          phb analyze --input runs/smoke.jsonl --output-prefix runs/smoke-report
          phb plot --report runs/smoke-report.json --output runs/smoke.svg
          phb generate --variation seeded_v1 --repetitions 6 --seed 100 \
            --conditions ordered,tail_matched --phases exit \
            --probes flaky_ci,parser_validator --output runs/pilot.jsonl
          phb sweep-plan --input runs/pilot.jsonl --layers 0,last \
            --alphas 0,1 --sources ordered --heldout-probes parser_validator \
            --output runs/pilot-plan.json
          phb pilot-plan --model /example/local-HF-checkpoint \
            --revision ffffffffffffffffffffffffffffffffffffffff \
            --output-dir runs/staged-pilot --repetitions 8
          test -f runs/staged-pilot/plan.json
          phb parade-plan --output-dir runs/parade-smoke --first-seed 30000 --repetitions 4
          phb parade-run --plan runs/parade-smoke/plan.json --backend mock-policy --output runs/parade-smoke/policy.jsonl
          phb parade-report --plan runs/parade-smoke/plan.json --input runs/parade-smoke/policy.jsonl --output runs/parade-smoke/policy-report.json
          phb parade-run --plan runs/parade-smoke/plan.json --backend mock-ontology --output runs/parade-smoke/ontology.jsonl
          phb parade-report --plan runs/parade-smoke/plan.json --input runs/parade-smoke/ontology.jsonl --output runs/parade-smoke/ontology-report.json
          phb parade-frame-export --plan runs/parade-smoke/plan.json --output runs/parade-smoke/frame-cases.jsonl
          test "$(wc -l < runs/parade-smoke/frame-cases.jsonl)" -eq 32
  mechanistic:
    name: CPU forward-hook tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and local package
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2'
          python -m pip install -e '.[test]'
      - name: Verify actual forward-hook intervention paths
        run: |
          python -m pytest tests/test_interventions.py tests/test_sweep.py tests/test_freegen.py tests/test_perc_components.py tests/test_sae_pipeline.py tests/test_attribution_graph.py -q

  percinterp-interop:
    name: PercInterp real-library adapter (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PercInterp from MoralityLabAI and PHB
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2'
          python -m pip install 'git+https://github.com/MoralityLabAI/percolation-interp@c0b3f6abf8e847292aaf1e21b8f4b804fd4d8ce0'
          python -m pip install -e '.[test]'
      - name: Exercise real percolation and holonomy contracts
        run: |
          python -m pytest tests/test_perc_bridge.py tests/test_perc_holonomy.py tests/test_perc_components.py tests/test_sae_pipeline.py tests/test_attribution_graph.py -q
          phb perc-select --graph examples/percinterp/direct-attribution-SYNTHETIC.json \
            --shuffles 8 --random-controls 2 --output runs/perc-SYNTHETIC-selection.json
          phb generate --variation seeded_v1 --repetitions 8 --seed 100 \
            --conditions ordered,tail_matched --phases exit \
            --probes flaky_ci,parser_validator --output runs/sae-ci-cases.jsonl
          phb sae-capture-plan --input runs/sae-ci-cases.jsonl \
            --output runs/sae-ci-plan.json
