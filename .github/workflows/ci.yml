name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: python -m pytest
      - name: Smoke bench
        run: |
          phb run --backend mock --repetitions 1 --phases exit,washout_2 --output runs/smoke.jsonl
          phb analyze --input runs/smoke.jsonl --output-prefix runs/smoke-report
          phb plot --report runs/smoke-report.json --output runs/smoke.svg
